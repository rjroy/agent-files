[project]
name = "audio-analysis-plugin"
version = "1.0.0"
description = "Audio and MIDI file analysis capabilities for Claude Code"
authors = [
    {name = "Ronald Roy", email = "gsdwig@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "librosa>=0.10.0,<0.12",
    "music21>=9.1,<10",
    "soundfile>=0.12,<1",
    "numpy>=1.20,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
    "pytest-cov>=4.0,<6",
    "mido>=1.3,<2",  # For MIDI test file generation
    "scipy>=1.11,<2",  # For audio test file generation
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=scripts --cov-report=term-missing"

[tool.coverage.run]
source = ["scripts"]
omit = ["tests/*", "scripts/shared/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
